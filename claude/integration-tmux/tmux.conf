# ============================================================================
# Claude Code - Tmux Tab Colors
# ============================================================================
#   @claude_status  ->  tab color
#   computing       ->  red        (thinking)
#   prompt          ->  yellow     (waiting for input)
#   unread          ->  brightcyan (finished, not seen)
#   idle            ->  green      (finished, seen / just launched)
#   (unset)         ->  white (inactive) / cyan (active)  — no Claude running
# ============================================================================

# Shared: map @claude_status -> a colour. Referenced below via #{E:@claude_fg}
# (E = expand) so the selection logic lives in exactly one place.
set -g @claude_fg "#{?#{==:#{@claude_status},computing},red,#{?#{==:#{@claude_status},prompt},yellow,#{?#{==:#{@claude_status},unread},brightcyan,green}}}"

# Inactive tabs: Claude color if status set, else white.
set -g window-status-format '#{?#{@claude_status},#[fg=#{E:@claude_fg}],#[fg=white]}#[bg=colour16,dim] #I.#W '

# Active tab: Claude color if status set, else cyan.
set -g window-status-current-format '#{?#{@claude_status},#[fg=#{E:@claude_fg}],#[fg=cyan]}#[bg=colour16,bright] #I.#W '

# When switching to a window, clear "unread" -> "idle".
set-hook -g session-window-changed '\
    if-shell \
        "[ \"$(tmux show-option -wqv @claude_status)\" = \"unread\" ]" \
        "set-option -w @claude_status idle"'

# On tmux restart, restore colors for windows running Claude.
set-hook -g client-attached \
    'run-shell "$HOME/dotfiles/claude/integration-tmux/tmux-init.sh"'
